[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starlight-rag"
version = "0.1.0"
description = "端到端可运行的企业级 RAG 知识库问答系统（CPU 友好，离线可全量验证）"
authors = [{ name = "晨星" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
