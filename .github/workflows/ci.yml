name: ci

# Continuous integration on a clean machine: byte-compile gate, advisory
# dependency install, unit tests and the project self-verification script.
# Author: 晨星

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile gate (hard)
        run: python -m compileall -q -x '\.git|\.venv|node_modules' .

      - name: Install dependencies (offline-friendly, advisory)
        run: |
          python -m pip install --upgrade pip
          # 逐包装：faiss-cpu/onnxruntime 等无 cp313 wheel 的包会让整批解析失败，
          # 导致连 fastapi/pytest 都装不上。逐个装、失败只警告不中断。
          for f in requirements.txt requirements-dev.txt requirements.lock.txt; do
            [ -f "$f" ] || continue
            grep -viE '^(llama[-_]cpp[-_]python|pywin32|audioop-lts)' "$f" > "/tmp/f_$f" || true
            grep -vE '^\s*(#|$)' "/tmp/f_$f" | while IFS= read -r pkg; do
              python -m pip install "$pkg" 2>>/tmp/pip.log || echo "::warning::skipped $pkg"
            done
          done
          # 测试核心依赖是硬门禁：装不上就必须让 CI 红，而不是留下 ImportError。
          python -m pip install pytest fastapi uvicorn pydantic
          python -c "import fastapi, pytest"

      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q
          else
            echo "no tests/ directory - skipping"
          fi

      - name: Self-verification script
        run: |
          for s in scripts/verify.py scripts/selfcheck.py tools/verify.py; do
            if [ -f "$s" ]; then echo "== $s"; python "$s"; exit $?; fi
          done
          echo "no verification script found"
